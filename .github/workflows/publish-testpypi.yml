name: Publish prerelease to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified 0.2.0b2 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download v0.2.0b2 --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'products_sqluserwizard-0.2.0b2-py3-none-any.whl' \
            --pattern 'products_sqluserwizard-0.2.0b2.tar.gz'
          echo '56af60dcf1de6b19d31dc3961bad72b762c4353285d6f5f62106f15dee734bc0  dist/products_sqluserwizard-0.2.0b2-py3-none-any.whl' | sha256sum --check
          echo '4a2da94c2a45931d6d238216e0f7e10a776bf9adec47ed3d50ca7a2d9a6b3b53  dist/products_sqluserwizard-0.2.0b2.tar.gz' | sha256sum --check
      - name: Publish to TestPyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
