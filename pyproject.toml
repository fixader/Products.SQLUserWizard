[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Products.SQLUserWizard"
version = "0.2.0b1"
description = "A Zope wizard that configures PAS SQL users through Z SQL Methods."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "SQL User Wizard contributors"}
]
dependencies = [
  "Zope>=5.0",
  "Products.PluggableAuthService>=2.0",
  "Products.ZSQLMethods",
  "segno",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Zope",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: WSGI",
]

[project.optional-dependencies]
test = [
  "pytest",
  "tomli; python_version < '3.11'",
]

[project.urls]
Source = "https://github.com/fixader/Products.SQLUserWizard"
Issues = "https://github.com/fixader/Products.SQLUserWizard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
